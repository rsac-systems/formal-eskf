name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install formatting dependencies
        run: ./scripts/install_ci_deps.sh format
      - name: Check C++ formatting
        env:
          CLANG_FORMAT: clang-format-14
        run: ./scripts/verify_ci.sh format

  script_tests:
    name: Script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install check dependencies
        run: ./scripts/install_ci_deps.sh checks
      - name: Check scripts and offline verification tools
        run: ./scripts/verify_ci.sh scripts

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Cppcheck dependencies
        run: ./scripts/install_ci_deps.sh cppcheck
      - name: Analyze unix32 and unix64
        run: ./scripts/verify_ci.sh cppcheck

  build_and_test:
    name: Build and test (${{ matrix.cxx }}, ${{ matrix.build_type }}, quat=${{ matrix.quat_approx }}, reset=${{ matrix.reset_approx }}, mag_tilt=${{ matrix.mag_tilt }}, codegen=${{ matrix.codegen }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-11]
        build_type: [Debug]
        quat_approx: ['OFF', 'ON']
        reset_approx: ['OFF', 'ON']
        mag_tilt: ['ON']
        codegen: ['ON']
        include:
          - cxx: g++-11
            build_type: Release
            quat_approx: 'OFF'
            reset_approx: 'OFF'
            mag_tilt: 'ON'
            codegen: 'ON'
          - cxx: clang++-14
            build_type: Release
            quat_approx: 'OFF'
            reset_approx: 'OFF'
            mag_tilt: 'OFF'
            codegen: 'ON'
          - cxx: g++-11
            build_type: Debug
            quat_approx: 'OFF'
            reset_approx: 'OFF'
            mag_tilt: 'ON'
            codegen: 'OFF'
    env:
      CXX: ${{ matrix.cxx }}
      BUILD_TYPE: ${{ matrix.build_type }}
      QUAT_APPROX: ${{ matrix.quat_approx }}
      RESET_APPROX: ${{ matrix.reset_approx }}
      MAG_TILT: ${{ matrix.mag_tilt }}
      CODEGEN: ${{ matrix.codegen }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: ./scripts/install_ci_deps.sh cpp
      - name: Build
        run: BUILD_JOBS="$(nproc)" ./scripts/verify_ci.sh build
      - name: Test
        run: ./scripts/verify_ci.sh test
      - name: Save test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ strategy.job-index }}
          path: output/tests/
          retention-days: 14

  asan:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXX: g++-11
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: ./scripts/install_ci_deps.sh asan
      - name: Run sanitizer suite
        run: ./scripts/verify_ci.sh asan

  lean:
    name: Lean
    runs-on: ubuntu-24.04
    # Cold proof builds run generated rows sequentially to bound peak memory.
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Lean proofs
        run: |
          ./scripts/verify_lean.sh --cache --wfail
          git diff --exit-code -- formal/lean/lake-manifest.json
